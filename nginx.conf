# Server block copied to /etc/nginx/conf.d/default.conf inside the image.
# Listens on 8080 so the container can run rootless.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Do not advertise the server version on error pages.
    charset utf-8;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Everything the site needs is served from this origin. No third-party
    # scripts, no remote fonts or images, and no inline script at all.
    #
    # style-src allows 'unsafe-inline' because the two membership charts set a
    # bar width through the React style attribute, which a strict style-src
    # blocks. That is the only inline style on the site, and there is no place
    # where untrusted input is rendered, so the exposure is nil. Tighten this to
    # `style-src 'self'; style-src-attr 'unsafe-inline'` once every browser we
    # support implements CSP level 3.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # ---------------------------------------------------------------------
    # Health probe (used by the HEALTHCHECK and by the reverse proxy)
    # ---------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    # NOTE: nginx does not merge add_header between levels - a location that
    # declares one header discards every header inherited from the server
    # block. Any location below that sets a header therefore repeats the
    # security headers verbatim.

    # Hashed build output is content-addressed, so it can be cached forever.
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # Self-hosted fonts, the archived PDFs, and any other static file: long
    # cache. The PDFs are immutable once published, so a month is safe.
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|webp|avif|ico|webmanifest|pdf|txt)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated so a deploy is picked up.
    location = /index.html {
        add_header Cache-Control          "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff"                        always;
        add_header X-Frame-Options        "SAMEORIGIN"                     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }

    # Client-side routing: unknown paths render the app, which routes them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Anything the app cannot route shows the branded 404 page if present.
    error_page 404 /index.html;

    location ~ /\. {
        deny all;
    }
}
